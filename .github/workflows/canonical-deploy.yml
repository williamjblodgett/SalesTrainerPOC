name: Canonical server deployment

on:
  workflow_dispatch:
    inputs:
      production:
        description: Deploy to the production domain
        type: boolean
        default: false
      allow_degraded_pilot:
        description: Deploy invite-only core while calibrated AI and scanner integrations remain gated
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: canonical-server-${{ inputs.production && 'production' || 'preview' }}
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.production && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm dlx vercel@latest pull --yes --environment=${{ inputs.production && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - if: inputs.production && !inputs.allow_degraded_pilot
        run: node --env-file=.vercel/.env.production.local scripts/check-production-env.mjs
      - if: inputs.production && inputs.allow_degraded_pilot
        run: node --env-file=.vercel/.env.production.local scripts/check-pilot-env.mjs
        env:
          APP_ENV: production
          AUTH_ACCESS_MODE: invite_only
          NEXT_PUBLIC_APP_URL: https://salessim-five.vercel.app
          NEXT_PUBLIC_MAIN_SITE_URL: https://salessim-five.vercel.app
          ENABLE_REALTIME_VOICE: "false"
      - run: pnpm dlx vercel@latest build ${{ inputs.production && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          APP_ENV: ${{ inputs.production && 'production' || 'preview' }}
          AUTH_ACCESS_MODE: invite_only
          NEXT_PUBLIC_APP_URL: ${{ inputs.production && 'https://salessim-five.vercel.app' || '' }}
          NEXT_PUBLIC_MAIN_SITE_URL: ${{ inputs.production && 'https://salessim-five.vercel.app' || '' }}
          ENABLE_REALTIME_VOICE: "false"
      - id: deploy
        shell: bash
        run: |
          runtime_args=()
          if [[ "${{ inputs.production }}" == "true" ]]; then
            runtime_args+=(
              --env APP_ENV=production
              --env AUTH_ACCESS_MODE=invite_only
              --env NEXT_PUBLIC_APP_URL=https://salessim-five.vercel.app
              --env NEXT_PUBLIC_MAIN_SITE_URL=https://salessim-five.vercel.app
              --env ENABLE_REALTIME_VOICE=false
            )
          fi
          deployment_url="$(pnpm dlx vercel@latest deploy --prebuilt ${{ inputs.production && '--prod' || '' }} "${runtime_args[@]}" --token=${{ secrets.VERCEL_TOKEN }})"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      - name: Verify production health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/api/health"
      - name: Install Chromium for release acceptance
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify public, invite, and recovery surfaces
        run: pnpm test:e2e:public --project=chromium
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
      - if: inputs.production && !inputs.allow_degraded_pilot
        name: Require authenticated release-test identity
        run: test -n "$E2E_EMAIL" && test -n "$E2E_PASSWORD"
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - if: inputs.production && !inputs.allow_degraded_pilot
        run: pnpm test:e2e:authenticated --project=chromium
        env:
          E2E_BASE_URL: ${{ steps.deploy.outputs.url }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-deployment-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
