name: Bootstrap owner password

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-owner:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Set temporary owner password
        shell: bash
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEMP_OWNER_PASSWORD: ${{ secrets.TEMP_OWNER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          test -n "$TEMP_OWNER_PASSWORD"
          echo "::add-mask::$TEMP_OWNER_PASSWORD"
          body="$(jq -cn --arg password "$TEMP_OWNER_PASSWORD" --arg display_name "WillB" \
            '{password: $password, user_metadata: {display_name: $display_name}}')"
          status="$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --request PUT \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header 'content-type: application/json' \
            --data "$body" \
            'https://iwigbylktbudvmjtqdvi.supabase.co/auth/v1/admin/users/5631e63c-be33-4d42-b79b-d36e98eb2813')"
          if [ "$status" != "200" ]; then
            echo "Owner password update failed with HTTP $status."
            exit 1
          fi
          echo "Temporary owner password set successfully."
