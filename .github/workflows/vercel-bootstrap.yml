name: Bootstrap canonical Vercel deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canonical-vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Create and link Vercel project
        shell: bash
        run: |
          pnpm dlx vercel@latest project inspect salessim --scope suadence --token "$VERCEL_TOKEN" >/dev/null 2>&1 || \
            pnpm dlx vercel@latest project add salessim --scope suadence --token "$VERCEL_TOKEN"
          pnpm dlx vercel@latest link --yes --team suadence --project salessim --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      - name: Deploy production application
        id: deploy
        shell: bash
        run: |
          if [[ -n "$OPENAI_API_KEY" ]]; then ai_provider="openai"; else ai_provider="mock"; fi
          if [[ -n "$CLOUDMERSIVE_API_KEY" ]]; then scanner_mode="cloudmersive"; else scanner_mode="built_in"; fi
          deployment_url="$(pnpm dlx vercel@latest deploy --yes --prod --scope suadence --token "$VERCEL_TOKEN" \
            --env APP_ENV=production \
            --env AI_PROVIDER="$ai_provider" \
            --env OPENAI_API_KEY="$OPENAI_API_KEY" \
            --env OPENAI_SCENARIO_MODEL=gpt-5.6-terra \
            --env OPENAI_EXTRACTION_MODEL=gpt-5.6-luna \
            --env OPENAI_PERSONA_MODEL=gpt-5.6-terra \
            --env OPENAI_BUYER_MODEL=gpt-5.6-luna \
            --env OPENAI_EVALUATOR_MODEL=gpt-5.6-terra \
            --env OPENAI_REALTIME_MODEL=gpt-realtime-2.1 \
            --env NEXT_PUBLIC_APP_URL=https://salessim-five.vercel.app \
            --env NEXT_PUBLIC_MAIN_SITE_URL=https://williamjblodgett.github.io/SalesTrainerPOC/ \
            --env NEXT_PUBLIC_SUPABASE_URL=https://iwigbylktbudvmjtqdvi.supabase.co \
            --env NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            --env SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            --env PERSONA_ENGINE_V2=true \
            --env BUYER_ACTOR_V2=true \
            --env EVALUATOR_V2=true \
            --env DOCUMENT_SCANNER_MODE="$scanner_mode" \
            --env CLOUDMERSIVE_API_KEY="$CLOUDMERSIVE_API_KEY" \
            --env ENABLE_REALTIME_VOICE=false \
            --env TEXT_REALISM_BENCHMARK_STATUS=pending \
            --env AUTH_SMTP_CONFIGURED=false \
            --env MONITORING_CONFIGURED=false \
            --env LEGAL_APPROVAL_STATUS=draft \
            --env STORE_RAW_CALL_AUDIO=false \
            --build-env NEXT_PUBLIC_APP_URL=https://salessim-five.vercel.app \
            --build-env NEXT_PUBLIC_MAIN_SITE_URL=https://williamjblodgett.github.io/SalesTrainerPOC/ \
            --build-env NEXT_PUBLIC_SUPABASE_URL=https://iwigbylktbudvmjtqdvi.supabase.co \
            --build-env NEXT_PUBLIC_SUPABASE_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLOUDMERSIVE_API_KEY: ${{ secrets.CLOUDMERSIVE_API_KEY }}
      - name: Verify production health
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/api/health"
