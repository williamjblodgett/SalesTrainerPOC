name: Apply and validate hosted Supabase

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Disposable or staging Supabase project reference
        required: true
        type: string
      apply_migrations:
        description: Apply pending migrations after the dry run
        required: true
        type: boolean
        default: false
      restore_project:
        description: Explicitly resume the paused project before validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hosted-database:
    runs-on: ubuntu-latest
    environment: supabase-staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: inputs.restore_project
        name: Resume the explicitly requested Supabase project
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/restore" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Link the requested project using Supabase project metadata
        run: |
          for attempt in $(seq 1 30); do
            if supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"; then
              exit 0
            fi
            echo "Project is not ready yet (attempt ${attempt}/30)."
            sleep 10
          done
          exit 1
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Build the project-region IPv4 session-pooler URL
        shell: bash
        run: |
          metadata="$(curl --fail-with-body --silent --show-error \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")"
          region="$(echo "$metadata" | jq -r '.region')"
          if [[ ! "$region" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]; then
            echo "Supabase returned an invalid project region." >&2
            exit 1
          fi
          encoded_password="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          db_url="postgresql://postgres.${PROJECT_REF}:${encoded_password}@aws-0-${region}.pooler.supabase.com:5432/postgres"
          echo "::add-mask::$db_url"
          echo "SUPABASE_DIRECT_DB_URL=$db_url" >> "$GITHUB_ENV"
          echo "Using the Supabase IPv4 session pooler in ${region}."
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push --db-url "$SUPABASE_DIRECT_DB_URL" --dry-run
      - if: inputs.apply_migrations
        run: supabase db push --db-url "$SUPABASE_DIRECT_DB_URL"
      - if: inputs.apply_migrations
        run: supabase test db --db-url "$SUPABASE_DIRECT_DB_URL"
      - if: inputs.apply_migrations
        name: Confirm core isolation suite is present
        run: test -f supabase/tests/core_access_isolation.sql
