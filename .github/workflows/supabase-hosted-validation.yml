name: Apply and validate hosted Supabase

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Disposable or staging Supabase project reference
        required: true
        type: string
      apply_migrations:
        description: Apply pending migrations after the dry run
        required: true
        type: boolean
        default: false
      restore_project:
        description: Explicitly resume the paused project before validation
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hosted-database:
    runs-on: ubuntu-latest
    environment: supabase-staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: inputs.restore_project
        name: Resume the explicitly requested Supabase project
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/restore" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}"
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Link the requested project using Supabase project metadata
        run: |
          for attempt in $(seq 1 30); do
            if supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"; then
              exit 0
            fi
            echo "Project is not ready yet (attempt ${attempt}/30)."
            sleep 10
          done
          exit 1
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - run: supabase db push --linked --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - if: inputs.apply_migrations
        run: supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - if: inputs.apply_migrations
        run: supabase test db --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - if: inputs.apply_migrations
        name: Confirm core isolation suite is present
        run: test -f supabase/tests/core_access_isolation.sql
