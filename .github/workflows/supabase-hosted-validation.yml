name: Apply and validate hosted Supabase

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Disposable or staging Supabase project reference
        required: true
        type: string
      apply_migrations:
        description: Apply pending migrations after the dry run
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hosted-database:
    runs-on: ubuntu-latest
    environment: supabase-staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Build masked direct database URL
        shell: bash
        run: |
          encoded_password="$(node -p 'encodeURIComponent(process.env.SUPABASE_DB_PASSWORD)')"
          pooler_host="${SUPABASE_POOLER_HOST:-aws-0-us-east-2.pooler.supabase.com}"
          db_url="postgresql://postgres.${PROJECT_REF}:${encoded_password}@${pooler_host}:5432/postgres"
          echo "::add-mask::$db_url"
          echo "SUPABASE_DIRECT_DB_URL=$db_url" >> "$GITHUB_ENV"
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
      - run: supabase db push --db-url "$SUPABASE_DIRECT_DB_URL" --dry-run
      - if: inputs.apply_migrations
        run: supabase db push --db-url "$SUPABASE_DIRECT_DB_URL"
      - if: inputs.apply_migrations
        run: supabase test db --db-url "$SUPABASE_DIRECT_DB_URL"
