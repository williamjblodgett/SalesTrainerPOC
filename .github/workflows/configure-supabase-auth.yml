name: Configure production Supabase Auth

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project reference
        required: true
        type: string
      confirmation:
        description: Type CONFIGURE_AUTH to apply invite-only production settings
        required: true
        type: string
      apply_email_templates:
        description: Apply custom templates only after custom SMTP or a paid mail provider is configured
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  configure-auth:
    if: inputs.confirmation == 'CONFIGURE_AUTH'
    runs-on: ubuntu-24.04
    environment: supabase-staging
    steps:
      - uses: actions/checkout@v4
      - name: Require Supabase management token
        run: test -n "$SUPABASE_ACCESS_TOKEN"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Build free-tier-compatible core Auth configuration
        run: jq 'with_entries(select(.key | startswith("mailer_") | not))' supabase/auth-production-config.json > /tmp/auth-core.json
      - name: Apply canonical Auth URLs, invite-only mode, and password policy
        run: |
          curl --fail-with-body --silent --show-error --request PATCH \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/auth-core.json
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - if: inputs.apply_email_templates
        name: Apply token-hash recovery and invitation templates
        run: |
          jq 'with_entries(select(.key | startswith("mailer_")))' supabase/auth-production-config.json > /tmp/auth-templates.json
          curl --fail-with-body --silent --show-error --request PATCH \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/auth-templates.json
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Verify non-secret auth configuration
        run: |
          config="$(curl --fail --silent --show-error \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}")"
          echo "$config" | jq -e '.site_url == "https://salessim-five.vercel.app"'
          echo "$config" | jq -e '.disable_signup == true'
          if [[ "$APPLY_EMAIL_TEMPLATES" == "true" ]]; then
            echo "$config" | jq -e '.mailer_templates_recovery_content | contains("token_hash")'
          fi
        env:
          PROJECT_REF: ${{ inputs.project_ref }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          APPLY_EMAIL_TEMPLATES: ${{ inputs.apply_email_templates }}
